<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DanceSlot - Agenda da Sala de Dança</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Container principal estilo Mockup Mobile App -->
  <div class="app-card">
    
    <!-- Cabeçalho (Dark Ultramarine) -->
    <header class="app-header">
      <div class="user-bar">
        <span class="icon">☰</span>
        <h1 class="brand-title">DanceSlot</h1>
      </div>
      <div class="calendar-preview">
        <h2>Controle de Horários</h2>
        <p>Agende ensaios e aulas com facilidade</p>
      </div>
    </header>

    <!-- Conteúdo em Curva (Honeydew Background) -->
    <main class="app-content">
      
      <!-- Feedback de Avisos/Erros -->
      <div id="mensagem-alerta" class="alerta hidden" aria-live="polite"></div>

      <!-- Formulário de Agendamento (Modal/Painel Flexível) -->
      <section class="form-section">
        <h3 id="form-title">Novo Agendamento</h3>
        <form id="agendamento-form">
          <input type="hidden" id="agendamento-id">
          
          <div class="input-group">
            <label for="titulo">Título da Aula/Ensaio</label>
            <input type="text" id="titulo" placeholder="Ex: Ensaio K-Pop / Ballet" required>
          </div>

          <div class="input-group">
            <label for="dancarino_responsavel">Responsável / Dançarino</label>
            <input type="text" id="dancarino_responsavel" placeholder="Ex: Profª Amanda" required>
          </div>

          <div class="input-row">
            <div class="input-group">
              <label for="data_hora_inicio">Início</label>
              <input type="datetime-local" id="data_hora_inicio" required>
            </div>
            <div class="input-group">
              <label for="data_hora_fim">Término</label>
              <input type="datetime-local" id="data_hora_fim" required>
            </div>
          </div>

          <div class="input-group">
            <label for="status">Status</label>
            <select id="status">
              <option value="Confirmado">Confirmado</option>
              <option value="Em Andamento">Em Andamento</option>
              <option value="Pendente">Pendente</option>
            </select>
          </div>

          <div class="form-actions">
            <button type="submit" id="btn-salvar" class="btn-primary">Salvar Agendamento</button>
            <button type="button" id="btn-cancelar" class="btn-cancel hidden">Cancelar</button>
          </div>
        </form>
      </section>

      <!-- Lista de Agendamentos -->
      <section class="list-section">
        <h3>Próximos Agendamentos</h3>
        <div id="lista-agendamentos" class="slots-container">
          <!-- Os cards de agendamento serão renderizados via JavaScript -->
        </div>
      </section>

    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
